name: build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # AGP 8.13.2 requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK command-line tools
        uses: android-actions/setup-android@v3

      # build.common.gradle sets compileSdkVersion 30, which the runner image does
      # not ship, so the platform has to be installed. Build-tools 35.0.0 is the
      # revision AGP 8.13.2 resolves to by default; the image happens to carry it
      # today, but it is pinned here so an image update cannot silently break the
      # build. Both versions were read off the build log, not chosen.
      #
      # build.common.gradle also declares ndkVersion 21.3.6528147. Neither module
      # has native sources, so AGP never resolves it and the NDK is not installed.
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-30" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble the TeamCode debug APK
        run: ./gradlew :TeamCode:assembleDebug --no-daemon --stacktrace

      - name: Run the TeamCode JVM unit tests
        run: ./gradlew :TeamCode:testDebugUnitTest --no-daemon --stacktrace
